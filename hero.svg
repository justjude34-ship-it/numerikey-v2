    <text x="220" y="280" font-size="86" opacity=".42">1</text>
    <text x="200" y="470" font-size="86" opacity=".38">3</text>
    <text x="230" y="680" font-size="86" opacity=".42">7</text>
    <text x="1380" y="280" font-size="86" opacity=".42">9</text>
    <text x="1380" y="470" font-size="72" opacity=".45">11</text>
    <text x="1380" y="680" font-size="72" opacity=".45">22</text>
