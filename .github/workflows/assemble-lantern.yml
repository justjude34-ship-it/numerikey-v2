name: Assemble Lantern
on:
  push:
    paths:
      - '.github/workflows/assemble-lantern.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Lantern.html
        run: |
          python3 - <<'PY'
          import base64, hashlib, pathlib
          parts = []
          for i in range(11):
              path = pathlib.Path(f"lantern/t{i:02d}.b64")
              if not path.exists():
                  raise SystemExit(f"missing {path}")
              parts.append(base64.b64decode(path.read_text().strip(), validate=True))
          html = b"".join(parts).decode("utf-8")
          for name in ("HERO", "ASSESS", "GROUND", "PRIVACY"):
              token = f"@@{name}@@"
              blob = pathlib.Path(f"{name.lower()}.b64").read_text().strip()
              html = html.replace(token, "data:image/jpeg;base64," + blob)
          if "@@" in html or "$file" in html:
              raise SystemExit("token left")
          raw = html.encode("utf-8")
          if not raw.startswith(b"<!DOCTYPE html>"):
              raise SystemExit(raw[:40])
          if raw.count(b'data:image/jpeg;base64') < 4:
              raise SystemExit("missing images")
          if b'src="data:image/jpeg;base64,' not in raw:
              raise SystemExit("hero src missing")
          digest = hashlib.sha256(raw).hexdigest()
          expect = "cb2eb3de580210c645cdfe08e33d055596490651271e23c8202c5a0c6aae864a"
          if len(raw) != 52341 or digest != expect:
              raise SystemExit(f"mismatch {len(raw)} {digest}")
          # confirm hero jpeg decodes
          import re
          m = re.search(r'id="heroImg"[^>]*src="data:image/jpeg;base64,([A-Za-z0-9+/=]+)"', html)
          if not m:
              raise SystemExit("hero tag")
          jpg = base64.b64decode(m.group(1), validate=True)
          if not (jpg.startswith(b"\xff\xd8") and jpg.endswith(b"\xff\xd9")):
              raise SystemExit("hero jpeg")
          pathlib.Path("Lantern.html").write_bytes(raw)
          print("bytes", len(raw), digest, "hero", len(jpg))
          PY
      - name: Commit assembled file
        run: |
          git config user.name "justjude34-ship-it"
          git config user.email "justjude34@gmail.com"
          git add Lantern.html
          if git diff --cached --quiet; then
            echo unchanged
            exit 0
          fi
          git commit -m "Fix Lantern hero image src"
          git push
