<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="NumeraKey gold numerology chart">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07040e"/>
      <stop offset="50%" stop-color="#12081c"/>
      <stop offset="100%" stop-color="#05040a"/>
    </linearGradient>
    <radialGradient id="neb" cx="20%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#7c5cbf" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#7c5cbf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="neb2" cx="85%" cy="20%" r="45%">
      <stop offset="0%" stop-color="#7c5cbf" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#7c5cbf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="38%">
      <stop offset="0%" stop-color="#f3d36a" stop-opacity=".5"/>
      <stop offset="40%" stop-color="#c9a227" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#c9a227" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0d27a"/>
      <stop offset="100%" stop-color="#c9a227"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#neb)"/>
  <rect width="1600" height="900" fill="url(#neb2)"/>
  <circle cx="800" cy="450" r="340" fill="url(#glow)"/>
  <g fill="none" stroke="url(#ring)" stroke-width="2">
    <circle cx="800" cy="450" r="78" opacity=".7"/>
    <circle cx="800" cy="450" r="140" opacity=".65"/>
    <circle cx="800" cy="450" r="210" opacity=".7"/>
    <circle cx="800" cy="450" r="280" opacity=".95"/>
  </g>
  <g fill="none" stroke="#e8c35a" stroke-width="1.1" opacity=".55">
    <circle cx="800" cy="310" r="140"/>
    <circle cx="800" cy="590" r="140"/>
    <circle cx="660" cy="380" r="140"/>
    <circle cx="940" cy="380" r="140"/>
    <circle cx="660" cy="520" r="140"/>
    <circle cx="940" cy="520" r="140"/>
  </g>
  <g fill="none" stroke="#c9a227" stroke-width=".8" opacity=".35">
    <line x1="520" y1="450" x2="1080" y2="450"/>
    <line x1="800" y1="170" x2="800" y2="730"/>
  </g>
  <circle cx="800" cy="450" r="8" fill="#fff6d2"/>
